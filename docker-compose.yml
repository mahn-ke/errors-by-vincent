#http
x-environment: &default-environment
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  VALKEY_URL: redis://valkey:6379
  SECRET_KEY: ${SECRET_KEY}
  PORT: 8000
  EMAIL_URL: smtp://${SMTP_USERNAME}:${SMTP_PASSWORD}@${SMTP_HOST}:${SMTP_PORT}
  GLITCHTIP_DOMAIN: https://errors.by.vincent.mahn.ke
  DEFAULT_FROM_EMAIL: glitchtip.by.vincent@mahn.ke
  EMAIL_USE_SSL: True

x-depends_on: &default-depends_on
  - postgres
  - valkey

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey:latest@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
    restart: unless-stopped
  web:
    # GlitchTip runs one process that serves HTTP and consumes the task queue;
    # the image no longer supports a dedicated worker
    image: glitchtip/glitchtip:latest@sha256:c245745b4179667da3aebd73fb8d4f1fd918f7d68ba07d1fd73ea688933b6e01
    depends_on: *default-depends_on
    ports:
      - "8003:8000"
    environment: *default-environment
    restart: unless-stopped
    volumes:
      - uploads:/code/uploads
  migrate:
    image: glitchtip/glitchtip:latest@sha256:c245745b4179667da3aebd73fb8d4f1fd918f7d68ba07d1fd73ea688933b6e01
    depends_on: *default-depends_on
    command: ./bin/run-migrate.sh
    environment: *default-environment

volumes:
  pg-data:
  uploads:
